<h1>Scrape progress</h1>
<p>The log below updates while the scrape runs. When it's done, the file shows up on the <a href="/downloads">Downloads</a> page.</p>
<pre id="logs">Loading…</pre>

<script>
  const logsElement = document.getElementById('logs');
  const containerId = new URLSearchParams(window.location.search).get('container_id');

  const showLogs = async () => {
    if (!containerId) {
      logsElement.textContent = 'No scrape selected. Open a scrape from the Running page.';
      return;
    }

    const response = await fetch(`/logs/${encodeURIComponent(containerId)}`);
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      logsElement.textContent = body.error || 'Could not load the log.';
      return;
    }

    logsElement.textContent = '';
    const reader = response.body.getReader();
    const decoder = new TextDecoder();

    // Each log line gets its own element, so a long line wraps under its message (see app.css).
    // Text after the last line break is kept until the rest of that line arrives.
    let unfinishedLine = '';
    const addLines = (text) => {
      const lines = (unfinishedLine + text).split(/\r?\n/);
      unfinishedLine = lines.pop();
      for (const line of lines) {
        const lineElement = document.createElement('span');
        lineElement.textContent = line;
        logsElement.append(lineElement);
      }
      logsElement.scrollTop = logsElement.scrollHeight;
    };

    while (true) {
      const { done, value } = await reader.read();
      if (done) {
        break;
      }
      addLines(decoder.decode(value, { stream: true }));
    }
    // Show a last line that didn't end with a line break
    unfinishedLine += decoder.decode();
    if (unfinishedLine !== '') {
      addLines('\n');
    }
  };

  showLogs().catch((error) => {
    logsElement.textContent = 'Could not load the log.';
    console.error('Error streaming logs:', error);
  });
</script>
