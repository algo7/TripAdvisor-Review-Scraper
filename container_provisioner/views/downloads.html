<h1>Downloads</h1>
<p>Finished scrapes, as CSV files. Look for your upload ID.</p>

{{if .Rows}}
<figure>
  <table>
    <thead>
      <tr>
        <th>File</th>
        <th>Upload ID</th>
        <th>Date</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {{range .Rows}}
      <tr>
        <td>{{.FileName}}</td>
        <td>{{.UploadedBy}}</td>
        <td>{{.Date}}</td>
        <td><a href="{{.Link}}">Download</a></td>
      </tr>
      {{end}}
    </tbody>
  </table>
</figure>
{{else}}
<p>No files yet.</p>
{{end}}

<script>
  // Reload the list when the page is shown again with the browser's Back button
  window.addEventListener('pageshow', (event) => {
    if (event.persisted) {
      location.reload();
    }
  });
</script>
