<h1>Running scrapes</h1>
<p>{{.CurrentTaskStatus}}</p>

{{if .RunningTasks}}
<figure>
  <table>
    <thead>
      <tr>
        <th>Target</th>
        <th>Upload ID</th>
        <th>Proxy location</th>
        <th>Container</th>
        <th>Progress</th>
      </tr>
    </thead>
    <tbody>
      {{range .RunningTasks}}
      <tr>
        <td>{{.TargetName}}</td>
        <td>{{.TaskOwner}}</td>
        <td>{{.VPNRegion}}</td>
        <td><code>{{.ContainerID}}</code></td>
        <td><a href="{{.URL}}">View logs</a></td>
      </tr>
      {{end}}
    </tbody>
  </table>
</figure>
{{end}}
