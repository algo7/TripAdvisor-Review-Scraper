{{if .ReturnHome}}
<article>
  <h2>The scrape didn't start</h2>
  <p>{{.Message1}}</p>
  <a href="/">Back to the form</a>
</article>
{{else}}
<article>
  <h2>Scrape started</h2>
  <p>{{.Message1}}</p>
  <p>{{.Message2}}</p>
  <p><a href="/logs-viewer?container_id={{.ContainerId}}">View progress</a></p>
  <p>{{.Message3}}</p>
  <p><strong>{{.UploadID}}</strong></p>
</article>
{{end}}
