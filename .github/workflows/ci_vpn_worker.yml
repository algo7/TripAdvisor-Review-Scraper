name: Build & Push [VPN Worker]
run-name: Build & Push VPN Worker triggered by ${{ github.actor }}

on:
  push:
    branches:
      - main
    paths:
      - 'proxy_pool/**'
      - '.github/workflows/ci_vpn_worker.yml'
  # Build the image on PRs too. Images are only pushed from main
  pull_request:
    branches:
      - main
    paths:
      - 'proxy_pool/**'
      - '.github/workflows/ci_vpn_worker.yml'

# Global variables
env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Jobs
jobs:
  # Continuous integration
  Build_VPN_Worker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      # Clone the repo
      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Login to GitHub Container Registry
      - name: Registry Login
        if: github.event_name == 'push'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./proxy_pool
          platforms: linux/amd64
          tags: ghcr.io/${{ github.actor }}/tripadvisor-review-scraper/vpn_worker:latest
          push: ${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=vpn_worker
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=vpn_worker' || '' }}
